<ng-container *transloco="let t">
<app-page-section [title]="t('motionLab.motion_lab_animation_showcase')" sub[title]="t('motionLab.sion_studio_ui_reference')">
  <div class="playground-header-row">
    <div class="intro-block">
      <p class="intro-text">{{ t('motionLab.a_workbench_showcasing_physics') }}</p>
    </div>
    
    <!-- Global Control Center -->
    <div class="global-settings-panel">
      <div class="setting-item">
        <label for="intensity-slider">{{ t('motionLab.global_motion_intensity') }}</label>
        <div class="slider-val-row">
          <p-slider id="intensity-slider" [(ngModel)]="motionIntensity" [min]="1" [max]="10"></p-slider>
          <span class="val-indicator">{{ motionIntensity }}/10</span>
        </div>
      </div>
      <div class="setting-item flex-row">
        <label class="toggle-control" for="a11y-motion-toggle">
          <input type="checkbox" id="a11y-motion-toggle" [(ngModel)]="simulateReducedMotion" />
          <span class="toggle-indicator"></span>
          <span>{{ t('motionLab.simulate') }}<code>{{ t('motionLab.reduced_motion') }}</code></span>
        </label>
      </div>
    </div>
  </div>

  <!-- Tabbed Interface -->
  <div class="local-tabs" role="tablist" [aria-label]="t('motionLab.animation_categories')">
    <button
      type="button"
      role="tab"
      id="tab-physics"
      [class.is-active]="activeTab === 'physics'"
      [attr.aria-selected]="activeTab === 'physics'"
      aria-controls="panel-physics"
      (click)="switchTab('physics')"
    >{{ t('motionLab.physics_springs') }}</button>
    <button
      type="button"
      role="tab"
      id="tab-interactions"
      [class.is-active]="activeTab === 'interactions'"
      [attr.aria-selected]="activeTab === 'interactions'"
      aria-controls="panel-interactions"
      (click)="switchTab('interactions')"
    >{{ t('motionLab.micro_interactions') }}</button>
    <button
      type="button"
      role="tab"
      id="tab-flip"
      [class.is-active]="activeTab === 'flip'"
      [attr.aria-selected]="activeTab === 'flip'"
      aria-controls="panel-flip"
      (click)="switchTab('flip')"
    >{{ t('motionLab.flip_layouts') }}</button>
    <button
      type="button"
      role="tab"
      id="tab-scroll"
      [class.is-active]="activeTab === 'scroll'"
      [attr.aria-selected]="activeTab === 'scroll'"
      aria-controls="panel-scroll"
      (click)="switchTab('scroll')"
    >{{ t('motionLab.scroll_stagger') }}</button>
    <button
      type="button"
      role="tab"
      id="tab-typography"
      [class.is-active]="activeTab === 'typography'"
      [attr.aria-selected]="activeTab === 'typography'"
      aria-controls="panel-typography"
      (click)="switchTab('typography')"
    >{{ t('motionLab.kinetic_typography') }}</button>
    <button
      type="button"
      role="tab"
      id="tab-canvas"
      [class.is-active]="activeTab === 'canvas'"
      [attr.aria-selected]="activeTab === 'canvas'"
      aria-controls="panel-canvas"
      (click)="switchTab('canvas')"
    >{{ t('motionLab.canvas_svg_physics') }}</button>
    <button
      type="button"
      role="tab"
      id="tab-advanced"
      [class.is-active]="activeTab === 'advanced'"
      [attr.aria-selected]="activeTab === 'advanced'"
      aria-controls="panel-advanced"
      (click)="switchTab('advanced')"
    >{{ t('motionLab.3d_advanced_effects') }}</button>
  </div>

  <div class="tab-panel-container">
    @switch (activeTab) {
      @case ('physics') {
        <app-spring-physics-panel
          [motionIntensity]="motionIntensity"
          [simulateReducedMotion]="simulateReducedMotion"
        ></app-spring-physics-panel>
      }
      @case ('interactions') {
        <app-micro-interactions-panel
          [simulateReducedMotion]="simulateReducedMotion"
        ></app-micro-interactions-panel>
      }
      @case ('flip') {
        <app-flip-layouts-panel
          [motionIntensity]="motionIntensity"
          [simulateReducedMotion]="simulateReducedMotion"
        ></app-flip-layouts-panel>
      }
      @case ('scroll') {
        <app-scroll-stagger-panel
          [motionIntensity]="motionIntensity"
          [simulateReducedMotion]="simulateReducedMotion"
        ></app-scroll-stagger-panel>
      }
      @case ('typography') {
        <app-kinetic-typography-panel
          [motionIntensity]="motionIntensity"
          [simulateReducedMotion]="simulateReducedMotion"
        ></app-kinetic-typography-panel>
      }
      @case ('canvas') {
        <app-canvas-svg-physics-panel
          [motionIntensity]="motionIntensity"
          [simulateReducedMotion]="simulateReducedMotion"
        ></app-canvas-svg-physics-panel>
      }
      @case ('advanced') {
        <app-tilt-card-panel
          [motionIntensity]="motionIntensity"
          [simulateReducedMotion]="simulateReducedMotion"
        ></app-tilt-card-panel>
      }
    }
  </div>
</app-page-section>

</ng-container>
