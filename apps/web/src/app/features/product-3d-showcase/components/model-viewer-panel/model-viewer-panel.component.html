<div class="viewer-container" [class.is-loading]="isLoading()">
  <model-viewer
    #viewer
    [attr.src]="modelUrl()"
    [attr.poster]="posterUrl()"
    [attr.environment-image]="environmentImage() || null"
    [attr.shadow-intensity]="shadowIntensity()"
    [attr.exposure]="exposure()"
    auto-rotate
    camera-controls
    touch-action="pan-y"
    interaction-prompt="auto"
    ar
    ar-modes="webxr scene-viewer quick-look"
    style="width: 100%; height: 100%;"
  >
    @for (hotspot of hotspots(); track hotspot.name) {
      <button
        class="hotspot"
        [attr.slot]="'hotspot-' + hotspot.name"
        [attr.data-position]="hotspot.position"
        [attr.data-normal]="hotspot.normal"
        [class.is-active]="activeHotspot === hotspot"
        (click)="onHotspotClick(hotspot)"
      >
        <span class="hotspot-dot"></span>
        @if (activeHotspot === hotspot) {
          <div class="hotspot-tooltip">
            <strong>{{ hotspot.label }}</strong>
            <p>{{ hotspot.description }}</p>
          </div>
        }
      </button>
    }

    <div class="progress-bar" slot="progress-bar">
      <div class="progress-track"></div>
    </div>
  </model-viewer>

  @if (isLoading()) {
    <div class="loading-overlay">
      <div class="loading-spinner"></div>
      <span class="loading-text">Loading 3D model…</span>
    </div>
  }
</div>
