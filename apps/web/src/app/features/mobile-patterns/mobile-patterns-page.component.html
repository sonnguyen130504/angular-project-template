<ng-container *transloco="let t">
<div class="showroom-layout">
  <aside class="sidebar">
    <header class="sidebar-header">
      <h2>{{ t('mobilePatterns.mobile_patterns') }}</h2>
      <p>{{ t('mobilePatterns.a_live_simulator_showcasing_im') }}</p>
    </header>

    <nav class="pattern-nav">
      @for (pattern of patterns; track pattern.id) {
        <button 
          type="button" 
          class="nav-item" 
          [class.active]="activePatternId() === pattern.id"
          (click)="selectPattern(pattern.id)">
          <strong>{{ pattern.name }}</strong>
          <small>{{ pattern.description }}</small>
        </button>
      }
    </nav>
  </aside>

  <main class="canvas">
    <div class="canvas-toolbar">
      <span>{{ activePattern().name }} Preview</span>
      <span class="badge">{{ t('mobilePatterns.live_iframe') }}</span>
    </div>
    
    <div class="simulator-wrapper">
      <app-mobile-simulator theme="light">
        <iframe 
          [src]="iframeUrl()" 
          class="mobile-iframe" 
          [title]="t('mobilePatterns.mobile_viewport')">
        </iframe>
      </app-mobile-simulator>
    </div>
  </main>
</div>

</ng-container>
